[package]
name = "app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "freediskcleaner"
path = "src/main.rs"

[features]
# Dev-only: Slint MCP server for agent UI control. NEVER enable in release builds or by default.
mcp = ["slint/mcp"]

[dependencies]
fdc-core.workspace = true
fdc-cleaner.workspace = true
fdc-fixtures.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
serde.workspace = true
serde_json.workspace = true
directories = "6"
sys-locale = "0.3"

[dev-dependencies]
tempfile.workspace = true
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"
fdc-core.workspace = true
