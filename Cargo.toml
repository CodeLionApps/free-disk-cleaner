[workspace]
resolver = "3"
members = ["crates/core", "crates/cleaner", "crates/app", "crates/fixtures", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.92"
publish = false

[workspace.dependencies]
fdc-core = { path = "crates/core" }
fdc-cleaner = { path = "crates/cleaner" }
fdc-fixtures = { path = "crates/fixtures" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
proptest = "1"
tracing = "0.1"
